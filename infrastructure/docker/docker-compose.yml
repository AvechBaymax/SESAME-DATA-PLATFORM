# Run from the repository root so the root .env is used for ${...} values:
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml up -d --build

x-minio-credentials: &minio-credentials
  # Object storage (RustFS) credentials. S3A in Spark reads the AWS_* names;
  # the Python code reads MINIO_* (names kept from the MinIO setup).
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
  AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}

x-serving: &serving-env
  # Serving layer (Postgres database shared with the web app; see lakehouse/serving.py).
  # Local development passwords; set real ones in .env for anything shared.
  SERVING_DB: sesame
  SERVING_JDBC_URL: jdbc:postgresql://postgres:5432/sesame
  SERVING_DB_USER: data_platform
  SERVING_DB_PASSWORD: ${SERVING_DB_PASSWORD:-data_platform_dev}

x-spark-common: &spark-common
  build:
    context: ../..
    dockerfile: infrastructure/docker/dockerfile
    target: spark
  image: sesame-spark:3.5.4
  environment: &spark-env
    <<: *minio-credentials
    PYTHONPATH: /opt/sesame/src
  volumes:
    - ../../src/jobs:/opt/spark-jobs
    - ../../src:/opt/sesame/src:ro

x-airflow-common: &airflow-common
  build:
    context: ../..
    dockerfile: infrastructure/docker/dockerfile
    target: airflow
  image: sesame-airflow:2.10.5
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    <<: [*minio-credentials, *serving-env]
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__SECRET_KEY: "change-me-secret-key"
    # Connection to the Spark cluster (SparkSubmitOperator, conn_id=spark_default)
    # JSON form: the host must carry the spark:// scheme. In URI form
    # ("spark://spark-master:7077") Airflow reads spark:// as the connection
    # type and spark-submit gets the invalid master "spark-master:7077".
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    # Settings for src/common and the ingest scripts, as seen from inside Docker
    MINIO_ENDPOINT: http://rustfs:9000
    MINIO_BUCKET: landing-zone
    LAKEHOUSE_BUCKET: lakehouse
    ICEBERG_CATALOG_DB: iceberg_catalog
    KAFKA_BROKER: kafka:29092
    OWM_API_KEY: ${OWM_API_KEY:-}
    WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:-web_app_dev}
  volumes:
    - ../../dags:/opt/airflow/dags
    - ../../logs:/opt/airflow/logs
    - ../../plugins:/opt/airflow/plugins
    - ../../src:/opt/airflow/src
    - ../../src/jobs:/opt/spark-jobs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------------- Object storage ----------------
  # RustFS: Apache-2.0, S3-compatible (replaces MinIO, whose free images were discontinued).
  # The MINIO_* variable names are kept for the S3 credentials used across the code.
  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: rustfs
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs_data:/data

  # ---------------- Kafka ----------------
  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    ports:
      - "9092:9092"   # clients on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      # localhost:9092 for the host, kafka:29092 for other containers (Spark, Airflow)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single node: internal topics need only 1 replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Creates the sensor topics (names from the architecture: sesame.sensor.raw + DLQ)
  kafka-init:
    image: apache/kafka:3.8.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic sesame.sensor.raw --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic sesame.sensor.raw.dlq --partitions 1 --replication-factor 1
    restart: "no"

  # ---------------- Spark cluster ----------------
  spark-master:
    <<: *spark-common
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      <<: *spark-env
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports:
      - "8081:8080"   # Spark Master UI
      - "7077:7077"   # Spark master

  spark-worker:
    <<: *spark-common
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      <<: *spark-env
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
      SPARK_WORKER_WEBUI_PORT: "8081"
    ports:
      - "8082:8081"   # Spark Worker UI
    depends_on:
      - spark-master

  # Sensor stream (src/jobs/sensor_stream.py): Kafka -> bronze.sensor_raw ->
  # silver.fact_sensor_reading / quarantine_sensor (+ DLQ topic). A long-running
  # Spark application, so it runs as its own service rather than from Airflow.
  # It takes 1 of the worker's 2 cores; the Airflow batch jobs use the other.
  spark-streaming:
    <<: *spark-common
    container_name: spark-streaming
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.executor.memory=768m
      # Small micro-batches: 4 shuffle partitions, not Spark's 200 (streaming
      # cannot coalesce them). Spark keeps this value in the query checkpoint.
      - --conf
      - spark.sql.shuffle.partitions=4
      - --driver-memory
      - 768m
      - /opt/spark-jobs/sensor_stream.py
    environment:
      <<: [*spark-env, *serving-env]
      KAFKA_BROKER: kafka:29092
      SENSOR_CHECKPOINT_DIR: /opt/spark/work-dir/checkpoints
      # Executors connect back to the driver running in this container
      SPARK_LOCAL_HOSTNAME: spark-streaming
    volumes:
      - ../../src/jobs:/opt/spark-jobs
      - ../../src:/opt/sesame/src:ro
      # Streaming checkpoints (Kafka offsets, Bronze snapshots read): keep them
      # with the data, or the stream starts over from the earliest offset
      - spark_checkpoints:/opt/spark/work-dir
    ports:
      - "4040:4040"   # Spark UI of the stream (Structured Streaming tab)
    depends_on:
      spark-worker:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      rustfs:
        condition: service_started
      postgres:
        condition: service_healthy
      airflow-init:   # creates the serving tables the stream writes sensor_recent into
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------- Airflow ----------------
  postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      # For the web app's backend on the host (database sesame, login web_app);
      # 5433 so it does not clash with a Postgres already running on the host
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the Iceberg JDBC catalog database on a fresh volume
      - ../postgres/init-iceberg-catalog.sql:/docker-entrypoint-initdb.d/10-iceberg-catalog.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    # Keep the image's own entrypoint: it registers the arbitrary AIRFLOW_UID as a
    # named user, without which the Airflow CLI refuses to run.
    command:
      - bash
      - -c
      - |
        python -m common.init_buckets &&
        python -m common.init_catalog &&
        python -m common.init_serving &&
        airflow db migrate &&
        airflow pools set spark 1 "Spark jobs run one at a time on the single worker" &&
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"   # Airflow UI
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    environment:
      <<: *airflow-env
      # Spark executors connect back to the driver running in this container
      SPARK_LOCAL_HOSTNAME: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  rustfs_data:
  kafka_data:
  postgres_data:
  spark_checkpoints:
