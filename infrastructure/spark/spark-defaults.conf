# Shared by the Spark containers and the Airflow (driver) container.

# Apache Iceberg: catalog "lakehouse" is the default, so `CREATE TABLE silver.x`
# creates an Iceberg table. The catalog lives in Postgres (JDBC catalog),
# the data and metadata files in the "lakehouse" bucket.
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                      lakehouse
spark.sql.catalog.lakehouse                   org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.catalog-impl      org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.lakehouse.uri               jdbc:postgresql://postgres:5432/iceberg_catalog
# Local development credentials, the same as the Postgres service in docker-compose.
spark.sql.catalog.lakehouse.jdbc.user         airflow
spark.sql.catalog.lakehouse.jdbc.password     airflow
spark.sql.catalog.lakehouse.jdbc.schema-version V1
spark.sql.catalog.lakehouse.warehouse         s3a://lakehouse/warehouse
spark.sql.catalog.lakehouse.io-impl           org.apache.iceberg.hadoop.HadoopFileIO

# Extra jars (Iceberg, Postgres JDBC, S3A, Kafka) baked into both images at the same path
spark.driver.extraClassPath                   /opt/spark/extra-jars/*
spark.executor.extraClassPath                 /opt/spark/extra-jars/*

# Object storage (RustFS locally, Ceph RGW in production) through S3A;
# credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                  http://rustfs:9000
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    false
spark.hadoop.fs.s3a.aws.credentials.provider  com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# Store timestamps in UTC (see docs/data-model.md)
spark.sql.session.timeZone                    UTC
